name: Run Godot Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    name: Godot test suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Run Godot tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          make test 2>&1 | tee test-results.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Comment test results on pull request
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- godot-test-results -->';
            const outcome = process.env.TEST_OUTCOME || 'unknown';
            const passed = outcome === 'success';
            const title = passed ? '✅ Godot tests passed' : '❌ Godot tests failed';
            const logPath = 'test-results.log';
            let output = fs.existsSync(logPath)
              ? fs.readFileSync(logPath, 'utf8')
              : 'The test step did not produce output.';

            const maxOutputLength = 12000;
            if (output.length > maxOutputLength) {
              output = '[...truncated... ]\n' + output.slice(-maxOutputLength);
            }

            const body = [
              marker,
              `## ${title}`,
              '',
              `Workflow run: [${context.workflow} #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '<details>',
              '<summary>Test output</summary>',
              '',
              '\`\`\`text',
              output,
              '\`\`\`',
              '</details>',
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.data.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
